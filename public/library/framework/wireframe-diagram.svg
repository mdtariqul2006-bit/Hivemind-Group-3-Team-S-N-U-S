<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#090b0e; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <pattern id="hexGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 11.5 L40 34.5 L20 46 L0 34.5 L0 11.5 Z" fill="none" stroke="#222731" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#hexGrid)" opacity="0.3"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="1520" height="70" rx="12" fill="#14181f" stroke="#2b313e" stroke-width="1"/>
  <text x="70" y="82" fill="#f59e0b" font-size="24" font-weight="700" letter-spacing="1">HIVEMIND: SMART ONBOARDING</text>
  <text x="500" y="80" fill="#94a3b8" font-size="14">System UI Architecture &amp; Low-Fidelity / High-Fidelity Wireframe Specification</text>
  <rect x="1410" y="58" width="120" height="34" rx="17" fill="url(#honeyGrad)"/>
  <text x="1440" y="80" fill="#ffffff" font-size="12" font-weight="600">v2.4 Final</text>

  <!-- Wireframe 1: Landing Page -->
  <g transform="translate(40, 140)">
    <rect width="480" height="380" rx="10" fill="#0f1217" stroke="#2b313e" stroke-width="1.5"/>
    <!-- Window top -->
    <rect width="480" height="30" rx="10" fill="#181d26"/>
    <circle cx="20" cy="15" r="5" fill="#ef4444"/>
    <circle cx="36" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="15" r="5" fill="#10b981"/>
    <text x="240" y="20" fill="#64748b" font-size="11" text-anchor="middle">01. Landing &amp; Hero Section Wireframe</text>
    
    <!-- Content mock -->
    <rect x="30" y="55" width="80" height="16" rx="4" fill="#f59e0b" opacity="0.8"/>
    <rect x="370" y="55" width="80" height="16" rx="8" fill="#2b313e"/>
    
    <!-- Hero Box -->
    <rect x="30" y="90" width="420" height="140" rx="8" fill="#14181f" stroke="#333b4d" stroke-dasharray="4"/>
    <rect x="50" y="110" width="180" height="16" rx="3" fill="#cbd5e1"/>
    <rect x="50" y="135" width="260" height="10" rx="2" fill="#64748b"/>
    <rect x="50" y="150" width="220" height="10" rx="2" fill="#64748b"/>
    <rect x="50" y="175" width="110" height="28" rx="14" fill="#f59e0b"/>
    <!-- 3D Robot placeholder -->
    <circle cx="380" cy="160" r="40" fill="#222731" stroke="#f59e0b" stroke-width="2"/>
    <text x="380" y="164" fill="#f59e0b" font-size="10" text-anchor="middle">3D Whobee</text>

    <!-- Promises grid -->
    <rect x="30" y="245" width="130" height="105" rx="6" fill="#14181f"/>
    <rect x="175" y="245" width="130" height="105" rx="6" fill="#14181f"/>
    <rect x="320" y="245" width="130" height="105" rx="6" fill="#14181f"/>
  </g>

  <!-- Wireframe 2: Personalisation Wizard -->
  <g transform="translate(560, 140)">
    <rect width="480" height="380" rx="10" fill="#0f1217" stroke="#2b313e" stroke-width="1.5"/>
    <rect width="480" height="30" rx="10" fill="#181d26"/>
    <circle cx="20" cy="15" r="5" fill="#ef4444"/>
    <circle cx="36" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="15" r="5" fill="#10b981"/>
    <text x="240" y="20" fill="#64748b" font-size="11" text-anchor="middle">02. Personalisation Wizard Wireframe</text>

    <rect x="120" y="55" width="240" height="8" rx="4" fill="#222731"/>
    <rect x="120" y="55" width="160" height="8" rx="4" fill="#f59e0b"/>

    <text x="240" y="90" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Pick your role at HiveMind</text>
    
    <!-- 3 Role cards -->
    <rect x="40" y="115" width="125" height="180" rx="8" fill="#14181f" stroke="#10b981" stroke-width="2"/>
    <text x="102" y="145" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">Designer</text>
    <rect x="55" y="165" width="95" height="6" rx="2" fill="#64748b"/>
    <rect x="55" y="180" width="80" height="6" rx="2" fill="#64748b"/>

    <rect x="177" y="115" width="125" height="180" rx="8" fill="#14181f" stroke="#333b4d"/>
    <text x="240" y="145" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Engineer</text>
    <rect x="192" y="165" width="95" height="6" rx="2" fill="#64748b"/>

    <rect x="315" y="115" width="125" height="180" rx="8" fill="#14181f" stroke="#333b4d"/>
    <text x="377" y="145" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Marketer</text>
    <rect x="330" y="165" width="95" height="6" rx="2" fill="#64748b"/>

    <rect x="180" y="320" width="120" height="32" rx="16" fill="#f59e0b"/>
    <text x="240" y="340" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Continue →</text>
  </g>

  <!-- Wireframe 3: Starter Roadmap Dashboard -->
  <g transform="translate(1080, 140)">
    <rect width="480" height="380" rx="10" fill="#0f1217" stroke="#2b313e" stroke-width="1.5"/>
    <rect width="480" height="30" rx="10" fill="#181d26"/>
    <circle cx="20" cy="15" r="5" fill="#ef4444"/>
    <circle cx="36" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="15" r="5" fill="#10b981"/>
    <text x="240" y="20" fill="#64748b" font-size="11" text-anchor="middle">03. Starter Dashboard Wireframe</text>

    <!-- TopBar -->
    <rect x="20" y="45" width="440" height="24" rx="4" fill="#14181f"/>
    <circle cx="440" cy="57" r="8" fill="#f59e0b"/>

