    <rect x="20" y="60" width="80" height="12" rx="3" fill="#f59e0b"/>
    <rect x="20" y="90" width="90" height="16" rx="4" fill="#2b313e"/>
    <rect x="20" y="115" width="90" height="16" rx="4" fill="#f59e0b" opacity="0.8"/>
    <rect x="20" y="140" width="90" height="16" rx="4" fill="#2b313e"/>

    <!-- Main Content: KPIs -->
    <rect x="145" y="50" width="105" height="60" rx="6" fill="#14181f" stroke="#333b4d"/>
    <text x="155" y="70" fill="#94a3b8" font-size="9">TOTAL STARTERS</text>
    <text x="155" y="92" fill="#f8fafc" font-size="16" font-weight="700">7 Starters</text>

    <rect x="258" y="50" width="105" height="60" rx="6" fill="#14181f" stroke="#10b981"/>
    <text x="268" y="70" fill="#10b981" font-size="9">ON TRACK</text>
    <text x="268" y="92" fill="#f8fafc" font-size="16" font-weight="700">3 On Track</text>

    <rect x="371" y="50" width="105" height="60" rx="6" fill="#14181f" stroke="#f59e0b"/>
    <text x="381" y="70" fill="#f59e0b" font-size="9">AHEAD</text>
    <text x="381" y="92" fill="#f8fafc" font-size="16" font-weight="700">1 Ahead</text>

    <rect x="484" y="50" width="105" height="60" rx="6" fill="#14181f" stroke="#ef4444"/>
    <text x="494" y="70" fill="#ef4444" font-size="9">AT RISK</text>
    <text x="494" y="92" fill="#f8fafc" font-size="16" font-weight="700">3 At Risk</text>

    <rect x="597" y="50" width="110" height="60" rx="6" fill="#14181f" stroke="#333b4d"/>
    <text x="607" y="70" fill="#94a3b8" font-size="9">COMPLETION</text>
    <text x="607" y="92" fill="#f8fafc" font-size="16" font-weight="700">55% Avg</text>

    <!-- Table -->
    <rect x="145" y="125" width="562" height="255" rx="6" fill="#14181f"/>
    <!-- Rows -->
    <line x1="145" y1="160" x2="707" y2="160" stroke="#2b313e" stroke-width="1"/>
    <line x1="145" y1="205" x2="707" y2="205" stroke="#2b313e" stroke-width="1"/>
    <line x1="145" y1="250" x2="707" y2="250" stroke="#2b313e" stroke-width="1"/>
    <line x1="145" y1="295" x2="707" y2="295" stroke="#2b313e" stroke-width="1"/>

    <circle cx="165" cy="182" r="12" fill="#f59e0b"/>
    <text x="185" y="186" fill="#f8fafc" font-size="11" font-weight="600">Mei Tanaka</text>
    <rect x="360" y="177" width="90" height="8" rx="4" fill="#10b981"/>
    <rect x="630" y="172" width="60" height="20" rx="10" fill="#10b981" opacity="0.2"/>
    <text x="660" y="186" fill="#10b981" font-size="10" text-anchor="middle">Ahead</text>
  </g>

  <!-- Wireframe 5: Employee Profile Side Drawer -->
  <g transform="translate(800, 560)">
    <rect width="760" height="400" rx="10" fill="#0f1217" stroke="#2b313e" stroke-width="1.5"/>
    <rect width="760" height="30" rx="10" fill="#181d26"/>
    <circle cx="20" cy="15" r="5" fill="#ef4444"/>
    <circle cx="36" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="15" r="5" fill="#10b981"/>
    <text x="380" y="20" fill="#64748b" font-size="11" text-anchor="middle">05. Employee Profile Side Drawer Wireframe</text>

    <!-- Background Table blurred -->
    <rect x="20" y="45" width="400" height="335" rx="6" fill="#14181f" opacity="0.3"/>

    <!-- Drawer Panel -->
    <rect x="430" y="40" width="320" height="350" rx="8" fill="#181d26" stroke="#f59e0b" stroke-width="1.5"/>
    
    <!-- Drawer Header -->
    <circle cx="465" cy="80" r="20" fill="#f59e0b"/>
    <text x="495" y="78" fill="#f8fafc" font-size="14" font-weight="700">Priya Anand</text>
    <text x="495" y="93" fill="#94a3b8" font-size="10">Product Designer • London, UK</text>

    <!-- Progress Bar -->
    <rect x="450" y="115" width="280" height="24" rx="4" fill="#14181f"/>
    <rect x="450" y="115" width="250" height="24" rx="4" fill="#f59e0b" opacity="0.8"/>
    <text x="590" y="131" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">11/12 Tasks (92%)</text>

    <!-- Details Grid -->
    <rect x="450" y="150" width="135" height="45" rx="6" fill="#14181f"/>
    <rect x="595" y="150" width="135" height="45" rx="6" fill="#14181f"/>
    
    <rect x="450" y="205" width="135" height="45" rx="6" fill="#14181f"/>
    <rect x="595" y="205" width="135" height="45" rx="6" fill="#14181f"/>

    <!-- Meetings -->
    <rect x="450" y="260" width="280" height="40" rx="6" fill="#14181f"/>
    <rect x="450" y="310" width="280" height="40" rx="6" fill="#14181f"/>
  </g>
</svg>
