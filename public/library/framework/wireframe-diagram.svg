    <rect x="20" y="80" width="440" height="110" rx="8" fill="#14181f"/>
    <circle cx="80" cy="135" r="32" fill="none" stroke="#2b313e" stroke-width="8"/>
    <circle cx="80" cy="135" r="32" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="200" stroke-dashoffset="40"/>
    <text x="80" y="140" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">92%</text>

    <rect x="130" y="105" width="180" height="12" rx="3" fill="#cbd5e1"/>
    <rect x="130" y="125" width="220" height="8" rx="2" fill="#64748b"/>
    <rect x="130" y="140" width="160" height="8" rx="2" fill="#64748b"/>

    <!-- Task List -->
