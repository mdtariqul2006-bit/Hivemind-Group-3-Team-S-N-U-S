    <rect x="20" y="260" width="440" height="48" rx="6" fill="#181d26"/>
    <rect x="20" y="315" width="440" height="48" rx="6" fill="#181d26"/>
  </g>

  <!-- Wireframe 4: Admin Console & HR Roster -->
  <g transform="translate(40, 560)">
    <rect width="720" height="400" rx="10" fill="#0f1217" stroke="#2b313e" stroke-width="1.5"/>
    <rect width="720" height="30" rx="10" fill="#181d26"/>
    <circle cx="20" cy="15" r="5" fill="#ef4444"/>
    <circle cx="36" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="15" r="5" fill="#10b981"/>
    <text x="360" y="20" fill="#64748b" font-size="11" text-anchor="middle">04. Admin Roster &amp; HR KPIs Wireframe</text>

    <!-- Sidebar -->
